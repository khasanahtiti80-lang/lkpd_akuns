<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1b1a;--card:#152826;--ink:#e6f2f0;--mut:#9bb5b1;--pri:#2dd4bf;--priInk:#06201d;--bd:#28423f;--bad:#ff8a7a;--ok:#6ee7a0}}
:root[data-theme=dark]{--bg:#0e1b1a;--card:#152826;--ink:#e6f2f0;--mut:#9bb5b1;--pri:#2dd4bf;--priInk:#06201d;--bd:#28423f;--bad:#ff8a7a;--ok:#6ee7a0}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:8px}
.logo{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center;cursor:pointer}
.logo i{background:var(--pri);color:var(--priInk);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-style:normal}
.btn{background:var(--pri);color:var(--priInk);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--bd)}
.btn.warm{background:var(--acc);color:#2a1a00}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.hero{padding:44px 0 28px;display:grid;gap:28px;grid-template-columns:1.1fr .9fr;align-items:center}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--mut);font-size:17px;max-width:46ch}
.sheet{background:var(--paper);color:var(--paperInk);border-radius:6px;padding:22px;box-shadow:0 12px 30px rgba(0,0,0,.18);transform:rotate(1.5deg);font-size:12px}
.sheet b{display:block;border-bottom:2px solid var(--pri);margin-bottom:6px;font-size:14px}
.sheet div{height:7px;background:#dfe7e5;border-radius:3px;margin:7px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--bd);font-size:12px;font-weight:700}
.tag.ok{background:var(--pri);color:var(--priInk)}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;gap:6px;align-items:center;margin:0;font-weight:500;border:1px solid var(--bd);border-radius:99px;padding:6px 12px;cursor:pointer;width:auto}
.chips input{width:auto}
.stepper{display:flex;gap:6px;margin:14px 0;overflow-x:auto}
.stepper button{flex:1;min-width:92px;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px;font-weight:700;color:var(--mut);cursor:pointer}
.stepper button.on{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.stepper button.done{color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.err{color:var(--bad);font-size:13px;margin-top:4px}
.sec{border-left:4px solid var(--acc)}
.sec h3{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ed{min-height:60px;padding:10px;border:1px dashed var(--bd);border-radius:10px;background:var(--bg)}
.ed img{max-width:100%}.ed table,.page table{border-collapse:collapse;width:100%}.ed td,.ed th,.page td,.page th{border:1px solid #888;padding:4px 8px}
.paperwrap{overflow:auto;background:var(--bd);padding:14px;border-radius:12px}
.page{background:var(--paper);color:var(--paperInk);width:794px;min-height:1123px;padding:56px 60px;margin:0 auto;transform-origin:top center;font:14px/1.6 Georgia,serif}
.page h2{font-size:17px;border-bottom:1px solid #444;margin:18px 0 6px}
.page .idt td{border:0;padding:1px 6px}.ed td,.page td,.page th{height:26px}.page h4{margin:10px 0 4px}.page ol,.page ul{margin:4px 0 8px;padding-left:22px}.page th{background:#e8efee}
.kop{text-align:center;border-bottom:3px double #000;padding-bottom:8px}
.fld{display:flex;gap:18px;margin:10px 0;font-size:13px}
.fld span{flex:1;border-bottom:1px solid #000}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--bd),var(--bg),var(--bd));background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
.ans{border:1px solid #888;margin:6px 0 12px}.page table{table-layout:auto;word-break:break-word;margin:6px 0 12px;font-size:12.5px}.page caption{caption-side:top;text-align:left;font-weight:700;padding:2px 0}.page thead{display:table-header-group}.page tr,.page li{break-inside:avoid}.page h4,.page h2,.page caption{break-after:avoid}.ed table{margin:6px 0}.ed caption{text-align:left;font-weight:700}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--bd)}.sw.on{border-color:var(--ink)}
.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}.side{background:var(--card);border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}.side nav{display:flex;flex-direction:column;gap:2px;margin-top:18px;flex:1}.side button{text-align:left;background:none;border:0;border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer;color:var(--ink)}.side button.on{background:var(--pri);color:var(--priInk)}.main{padding:28px 32px;min-width:0;max-width:1100px;width:100%}.main h1{font-size:30px;font-weight:800;margin-bottom:14px}.prog{height:9px;background:var(--bd);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}.plab{font-size:12px;color:var(--mut);font-weight:700;margin:6px 0 16px}.pill{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer}.pill.on{background:var(--pri);color:var(--priInk);border-color:var(--pri)}.star{background:none;border:0;font-size:18px;cursor:pointer;color:var(--acc)}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--bd)}.side .logo{display:none}.side nav{flex-direction:row;margin:0;flex:none}.side button{white-space:nowrap;padding:8px 12px}.main{padding:16px}}
#toasts{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:9}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:320px;font-weight:600}
.toast.bad{background:var(--bad);color:#fff}
table.list{width:100%;border-collapse:collapse}.list td,.list th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
@media(max-width:720px){.hero{grid-template-columns:1fr}.sheet{display:none}.list .hm{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>

function check(){const s=S.cur.sections,r=[],has=k=>s.find(x=>x.key===k&&x.body.replace(/<[^>]+>/g,'').trim().length>10);

function referensi(){const C=(t,b)=>`<div class="card"><h3>${t}</h3>${b}</div>`;return shell(`<h1>Referensi</h1><div class="grid">${C('Taksonomi Bloom (C1–C6)','<p><b>C1 Mengingat</b>: menyebutkan, mendaftar<br><b>C2 Memahami</b>: menjelaskan, merangkum<br><b>C3 Menerapkan</b>: menghitung, menggunakan<br><b>C4 Menganalisis</b>: membandingkan, mengelompokkan<br><b>C5 Mengevaluasi</b>: menilai, menyimpulkan<br><b>C6 Mencipta</b>: merancang, membuat</p>')}${C('Level soal','<p><b>LOTS</b>: C1–C2<br><b>MOTS</b>: C3<br><b>HOTS</b>: C4–C6</p>')}${C('Profil Pelajar Pancasila','<p>Beriman, bertakwa kepada Tuhan YME, dan berakhlak mulia · Berkebinekaan global · Bergotong royong · Mandiri · Bernalar kritis · Kreatif</p>')}${C('Sintaks model pembelajaran','<p><b>PBL</b>: orientasi masalah → organisasi belajar → penyelidikan → penyajian hasil → evaluasi<br><b>PjBL</b>: pertanyaan mendasar → rancangan → jadwal → pelaksanaan → pengujian hasil → evaluasi<br><b>Discovery</b>: stimulasi → identifikasi masalah → pengumpulan data → pengolahan → verifikasi → generalisasi</p>')}${C('Istilah capaian','<p><b>Kurikulum 2013</b>: KI, KD, IPK<br><b>Kurikulum Merdeka</b>: CP, TP, ATP<br><b>Perguruan Tinggi</b>: CPL, CPMK, Sub-CPMK</p>')}</div>`,'referensi')}

const THEMES=[['Teal','#0f766e','#f59e0b'],['Biru','#1d4ed8','#f59e0b'],['Ungu','#6d28d9','#f59e0b'],['Merah muda','#be185d','#f59e0b'],['Merah','#b91c1c','#f59e0b'],['Oranye','#c2410c','#0f766e'],['Hijau','#15803d','#f59e0b'],['Abu-abu','#334155','#f59e0b']];
let TH=Object.assign({mode:'auto',pri:'#0f766e',acc:'#f59e0b'},ls.get('lkpd.theme',{}));
const hex2=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mixc=(h,t)=>'#'+hex2(h).map(c=>Math.round(c*(1-t)+255*t).toString(16).padStart(2,'0')).join(''),lum=h=>{const[r,g,b]=hex2(h).map(c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
function applyTheme(){const r=document.documentElement,st=r.style,dark=TH.mode==='dark'||(TH.mode==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
if(TH.mode==='auto')r.removeAttribute('data-theme');else r.dataset.theme=TH.mode;
const pri=dark?mixc(TH.pri,.35):TH.pri;st.setProperty('--pri',pri);st.setProperty('--priInk',lum(pri)>.4?'#111111':'#ffffff');st.setProperty('--acc',TH.acc);
if(dark){st.removeProperty('--bg');st.removeProperty('--bd')}else{st.setProperty('--bg',mixc(TH.pri,.94));st.setProperty('--bd',mixc(TH.pri,.8))}}

const GBASE='https://generativelanguage.googleapis.com/v1beta/';
async function ask(prompt,opts){
const key=(localStorage.getItem('gemini_key')||'').trim();
if(!key)throw{code:'no_key',message:'Kunci API Gemini belum diisi. Buka menu Pengaturan, tempel kunci API di bagian Koneksi AI, lalu Simpan.'};
const sl=ms=>new Promise(x=>setTimeout(x,ms));
let model=localStorage.getItem('gemini_model')||'gemini-2.5-flash',repicked=false;
for(let i=0;i<4;i++){
const body={contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.7,maxOutputTokens:16384,responseMimeType:'application/json'}};
if(/2[.]5-flash/.test(model))body.generationConfig.thinkingConfig={thinkingBudget:0};
let r,t;
try{r=await fetch(GBASE+'models/'+model+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:JSON.stringify(body),signal:opts&&opts.signal});t=await r.text()}
catch(e){if(e&&e.name==='AbortError')throw e;if(i<3){await sl(1500*(i+1));continue}throw{code:'err',message:'Koneksi ke Gemini gagal. Periksa internet Anda.'}}
if(r.ok){const j=JSON.parse(t),c=j.candidates&&j.candidates[0];const out=c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||'').join(''):'';if(out)return out;throw{code:'err',message:'Respons AI kosong ('+((c&&c.finishReason)||'tanpa kandidat')+'). Coba lagi.'}}
if(r.status===404&&!repicked){repicked=true;try{const lr=await fetch(GBASE+'models?pageSize=200',{headers:{'x-goog-api-key':key}});const names=((await lr.json()).models||[]).filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')).map(x=>String(x.name).replace(/^models[/]/,'')).filter(n=>/^gemini-[0-9.]+-flash$/.test(n)).sort((a,b)=>parseFloat(b.slice(7))-parseFloat(a.slice(7)));if(names[0]){model=names[0];localStorage.setItem('gemini_model',model);continue}}catch(e){}}
if((r.status===429||r.status>=500)&&i<2){await sl(2000*(i+1));continue}
if(r.status===429)throw{code:'rate_limited',message:'Kuota Gemini penuh. Tunggu 1 menit lalu coba lagi.'};
if([400,401,403].includes(r.status)&&/API key|permission|PERMISSION_DENIED|UNAUTHENTICATED/i.test(t))throw{code:'no_key',message:'Kunci API ditolak oleh Google. Periksa kembali kunci di Pengaturan.'};
throw{code:'err',message:'Gemini API '+r.status+': '+t.slice(0,200)}}
throw{code:'err',message:'Gemini tidak merespons. Coba lagi.'}}
function errMsg(e){const c=e&&e.code;return c==='not_granted'?'Izin AI ditolak. Izinkan akses lalu coba lagi.':c==='rate_limited'?'Kuota Gemini sedang penuh. Tunggu 1 menit lalu coba lagi.':c==='na'||c==='no_key'?e.message:e&&e.name==='AbortError'?'Dibatalkan.':'Gagal membuat LKPD: '+(e&&e.message||'koneksi bermasalah')+'. Tekan Generate untuk mencoba lagi.'}

const mod=()=>S.cur.p.model==='Custom'?(S.cur.p.modelCustom||'bebas'):S.cur.p.model;
const CPH=()=>/Merdeka/.test(S.cur.p.kur)?'Capaian Pembelajaran | Tujuan Pembelajaran | Indikator Keberhasilan | Materi | Aktivitas | Penilaian':/2013/.test(S.cur.p.kur)?'Kompetensi Dasar | Indikator Pencapaian Kompetensi | Materi | Aktivitas | Penilaian | Bentuk Penilaian':'CPL / CPMK | Sub-CPMK / Tujuan | Indikator | Materi | Aktivitas | Penilaian';
const R={
cp:c=>`Satu TABEL (cap "Keterkaitan Kompetensi, Aktivitas, dan Penilaian") dengan kolom: ${CPH()}. Satu baris per pertemuan (${c.P} pertemuan, minimal ${Math.min(c.P,3)} baris), isi spesifik materi dan saling terkait. Pakai CP/TP/KD dari pengguna bila ada; bila tidak, tulis rumusan wajar dan JANGAN mengarang kode atau nomor KD/CP resmi. Tambahkan satu blok p catatan: rumusan perlu dicocokkan dengan dokumen kurikulum resmi.`,
tujuan:c=>`Tujuan pembelajaran spesifik, terukur (kata kerja operasional + kondisi + kriteria), sesuai jenjang. Untuk setiap pertemuan (${c.P}) beri blok h "Pertemuan ke-n" lalu ol berisi 2-3 tujuan. Selaraskan dengan model ${mod()}.`,
petunjuk:c=>`Petunjuk belajar berupa ol 7-9 butir runtut: cara membaca dan mengerjakan, penggunaan sumber belajar, aturan diskusi (peserta: ${S.cur.p.peserta||'Kelompok'}), cara mengisi tabel, pengumpulan hasil, alokasi waktu ${S.cur.p.waktu}, dan cara penilaian.`,
materi:c=>`Uraian materi mendalam, minimal 450 kata, bukan sekadar definisi. Urutan: h judul pemantik + p stimulus (kasus atau ilustrasi tekstual; jika perlu gambar tulis p "[Tempat gambar: deskripsi]"); beberapa h subjudul (konsep inti, penjelasan, rumus atau langkah atau struktur dalam ol/ul); contoh soal dengan penyelesaian atau contoh kasus; minimal 1 table (ringkasan, perbandingan, atau contoh data); contoh penerapan di kehidupan nyata atau dunia kerja. Untuk akuntansi/keuangan sertakan data transaksi, contoh perhitungan, dan format jurnal (table: Tanggal | Keterangan Transaksi | Akun | Debit | Kredit) atau lembar kerja. Jangan mengulang isi; jangan mengarang sumber.`,
latihan:c=>`Lembar kerja Pertemuan ${c.i} dari ${c.P}. Blok berurutan: h "Pertemuan ${c.i}"; p "Tujuan kegiatan: ..."; ol petunjuk pengerjaan/langkah kegiatan sesuai model ${mod()} (4-6 langkah); p "Bentuk kerja: ${S.cur.p.peserta||'Kelompok'}"; h "Kasus / Permasalahan" + p kasus kontekstual lengkap dengan data; h "Tugas" + ol 3-5 tugas; minimal 1 TABEL KERJA yang spesifik materi (contoh analisis teks: No. | Kutipan atau Data | Aspek yang Dianalisis | Hasil Analisis; akuntansi: Tanggal | Keterangan Transaksi | Akun yang Terpengaruh | Debit | Kredit; evaluasi: No. | Indikator Soal | Pertanyaan | Jawaban Siswa | Skor), sebagian baris berisi data/contoh dan minimal 3 baris kosong (blank) untuk jawaban siswa; blok ans untuk kolom jawaban/kesimpulan; p "Hasil yang diharapkan: ...". Fokus pertemuan ini berbeda dan berurutan dengan pertemuan lain.`,
soal:c=>`Tepat ${c.n} butir soal sesuai bentuk: ${S.cur.p.bentuk.join(', ')}, tingkat ${S.cur.p.level}. Bagi jumlahnya antarbentuk (total ${c.n}). Pilihan ganda pakai blok mcq (4 opsi), isian dan uraian pakai blok ol. Beri h per bentuk. Satu item = satu butir; jangan membuat item di luar ${c.n}.`,
hots:c=>`4 soal HOTS (C4-C6) berbasis kasus kontekstual: ol, tiap butir memuat kasus singkat lalu pertanyaan analisis/evaluasi/cipta.`,
literasi:c=>`Teks bacaan buatan sendiri 150-250 kata (p, tanpa klaim fakta yang tidak pasti), lalu ol 3-4 pertanyaan literasi.`,
numerasi:c=>`3-4 soal numerasi kontekstual dengan data (boleh table), disajikan dalam ol.`,
refleksi:c=>`ol 4-5 pertanyaan refleksi; lalu tiga ans dengan label "Kesimpulan yang saya peroleh", "Kesulitan yang saya alami", "Rencana tindak lanjut belajar saya" (n 3).`,
kunci:c=>`Kunci jawaban untuk SEMUA tugas dan soal pada konteks, urut nomor. Per pertemuan beri h, TABEL kunci yang sudah terisi (analisis/jurnal/hitungan lengkap) dan jawaban tiap tugas dan soal. Untuk tugas terbuka atau proyek tulis contoh jawaban dan kriteria jawaban yang dapat diterima. Jika data soal tidak cukup, tulis kriteria, jangan mengarang jawaban.`,
kisi:c=>`TABEL (cap "Kisi-kisi Penilaian Pengetahuan") dengan 7 kolom tepat: Kompetensi / Capaian Pembelajaran | Tujuan / Indikator Pembelajaran | Materi | Indikator Soal | Bentuk Soal | No. Soal | Level Kognitif. Satu baris per butir atau kelompok soal pada konteks; nomor soal sesuai konteks.`,
pengetahuan:c=>`TABEL (cap "Rubrik Penilaian Pengetahuan") kolom: No. Soal | Aspek yang Dinilai | Kriteria Jawaban | Skor Maksimal | Pedoman Pemberian Skor. Satu baris per soal; objektif: kunci dan aturan skor (benar 1, salah 0); uraian: komponen jawaban yang diberi skor beserta nilainya (jumlah = skor maksimal). Baris terakhir "Total" skor maksimal. Lalu p: Nilai = (Skor yang diperoleh ÷ Skor maksimal) × 100.`,
sikap:c=>`Penilaian sikap dan proses yang relevan dengan kegiatan (misal kerja sama, tanggung jawab, kedisiplinan, keaktifan); JANGAN memaksakan aspek spiritual. Blok: p identitas (Nama peserta didik / kelompok: ........ ; Kelas: ........ ; Materi pokok: ........ ; Pertemuan: ........); TABEL lembar observasi: No. | Aspek yang Diamati | Indikator Perilaku | 4 | 3 | 2 | 1 | Skor | Catatan Guru (4-5 aspek, kolom skor dan catatan kosong); TABEL skala: Skor | Kategori | Deskripsi; p pedoman: Nilai = (jumlah skor ÷ (jumlah aspek × 4)) × 100 dengan angka konkret; boleh TABEL predikat.`,
keterampilan:c=>`Penilaian keterampilan untuk produk, praktik, presentasi, atau unjuk kerja dari kegiatan: TABEL kisi (Kompetensi | Indikator Keberhasilan | Bentuk Penilaian / Produk | Level); TABEL rubrik khusus tugas: No. | Aspek yang Dinilai | Skor 4 (deskripsi konkret) | Skor 3 | Skor 2 | Skor 1 | Bobot, 4-6 aspek, deskripsi tiap skor menjelaskan perbedaan kualitas hasil yang konkret untuk tugas ini; baris Total skor maksimal; p pedoman penskoran dengan rumus berbobot bila ada bobot.`,
penskoran:c=>`Pedoman penskoran dan nilai akhir yang KONSISTEN dengan rubrik pada konteks (ambil skor maksimal dari konteks): TABEL kolom Komponen Penilaian | Instrumen | Skor Maksimal | Bobot (%) | Cara Menghitung. Total bobot tepat 100 (baris Total boleh ditambahkan). Lalu p rumus tiap komponen: Nilai = (Skor yang diperoleh ÷ Skor maksimal) × 100; p rumus nilai akhir berbobot; TABEL predikat (Rentang Nilai | Predikat | Tindak Lanjut); p contoh perhitungan dengan angka.`,
remedial:c=>`ol 3-4 kegiatan atau soal sederhana untuk peserta didik yang belum tuntas, p syarat dan bentuk umpan balik.`,
pengayaan:c=>`ol 2-3 tugas tantangan untuk yang sudah tuntas, p bentuk umpan balik.`,
kisi_ev:c=>`TABEL (cap "Kisi-kisi Evaluasi") 8 kolom tepat: No. | Capaian / Tujuan Pembelajaran | Materi | Indikator Soal | Bentuk Soal | No. Soal | Level Kognitif | Skor. Tepat satu baris per butir soal (${c.n} baris) sesuai konteks.`,
kunci_ev:c=>`TABEL (cap "Kunci Jawaban dan Pembahasan") kolom: No. | Bentuk | Kunci / Jawaban | Pembahasan Singkat | Skor. Tepat ${c.n} baris, urut nomor soal pada konteks.`};
R.soal_ev=c=>R.soal(c)+' Cakup seluruh materi pokok secara proporsional; boleh beri stimulus singkat.';R.rubrik_ev=R.pengetahuan;R.penskoran_ev=c=>R.penskoran(c)+' Komponen berupa bentuk soal (pilihan ganda, isian, uraian) dengan skor maksimal masing-masing sesuai kunci dan rubrik pada konteks.';
function hdr(){const p=S.cur.p;return `Kamu pakar kurikulum dan penyusun perangkat ajar Indonesia. Data: jenjang ${p.jenjang}, kelas/tingkat ${p.kelas}, ${p.kur}, semester ${p.semester||'Genap'}, mapel ${p.mapel}, materi pokok "${p.materi}", judul "${p.judul||'-'}", satuan pendidikan ${p.sekolah||'-'}, alokasi ${p.waktu}, ${p.pertemuan||1} pertemuan, model ${mod()}, peserta ${p.peserta||'Kelompok'}, aktivitas ${(p.akt||[]).join(', ')||'-'}, tingkat ${p.level}, jumlah soal ${p.n}, bentuk soal ${(p.bentuk||[]).join(', ')}. Tujuan dari pengguna: ${p.tujuan||'(rumuskan)'}. Kompetensi: ${p.kompetensi||'-'}. CP/TP/ATP/P5/Asesmen dari pengguna: ${p.cp||'(kosong)'}. Elemen tambahan: ${(p.ekstra||[]).join(', ')||'-'}. Catatan: ${p.catatan||'-'}.\nAturan: bahasa Indonesia sesuai usia jenjang; isi mendalam, relevan, dan tidak mengulang; jangan mengarang kurikulum, kode kompetensi resmi, referensi, kutipan, atau data faktual yang tidak pasti (pakai kasus buatan yang jelas sebagai ilustrasi); tujuan, materi, kegiatan, soal, kunci, dan rubrik harus saling berkaitan; teks polos tanpa HTML atau markdown.`}
const SCH='Balas HANYA JSON: {"blocks":[...]}. Jenis blok: {"t":"h","x":"subjudul"}; {"t":"p","x":"paragraf"}; {"t":"ol","items":["..."]}; {"t":"ul","items":["..."]}; {"t":"mcq","items":[{"q":"pertanyaan","o":["opsi A","opsi B","opsi C","opsi D"]}]}; {"t":"table","cap":"judul tabel","head":["Kolom 1","Kolom 2"],"rows":[["sel","sel"]],"blank":0}; {"t":"ans","x":"label ruang jawaban","n":4}. Sel yang harus diisi siswa dikosongkan dengan string kosong dan/atau tambah "blank":N baris kosong. Setiap baris tabel punya jumlah sel sama dengan head.';
const secPrompt=(k,c,ctx,iss)=>hdr()+(ctx?'\n\nKONTEKS bagian lain (wajib konsisten):\n'+ctx:'')+`\n\n[BAGIAN:${k}] ${R[k](c)}`+(iss&&iss.length?'\n\nPERBAIKI kekurangan percobaan sebelumnya: '+iss.join('; ')+'.':'')+'\n\n'+SCH;
function normBlocks(a){return (Array.isArray(a)?a:[]).filter(b=>b&&typeof b==='object'&&['h','p','ol','ul','mcq','table','ans'].includes(b.t)).map(b=>{if(b.x!=null)b.x=String(b.x);if(b.t==='table'){b.head=(b.head||[]).map(String);b.rows=(b.rows||[]).map(r=>(Array.isArray(r)?r:[r]).map(c=>c==null?'':String(c)))}if(b.items)b.items=b.items.map(i=>b.t==='mcq'?{q:String((i&&i.q)||''),o:((i&&i.o)||[]).map(String)}:(typeof i==='object'&&i?String(i.q||i.x||''):String(i)));return b})}
function blk2html(bl){const E=s=>esc(s).replace(/\n/g,'<br>');return bl.map(b=>{switch(b.t){case'h':return `<h4>${E(b.x)}</h4>`;case'p':return `<p>${E(b.x)}</p>`;case'ol':case'ul':return `<${b.t}>${(b.items||[]).map(i=>`<li>${E(i)}</li>`).join('')}</${b.t}>`;case'mcq':return `<ol>${(b.items||[]).map(i=>`<li>${E(i.q)}<ol type="A">${(i.o||[]).map(o=>`<li>${E(o)}</li>`).join('')}</ol></li>`).join('')}</ol>`;case'table':{const h=b.head||[],n=h.length||1,rows=(b.rows||[]).concat(Array.from({length:+b.blank||0},()=>Array(n).fill('')));return `<table>${b.cap?`<caption>${E(b.cap)}</caption>`:''}<thead><tr>${h.map(c=>`<th>${E(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${Array.from({length:n},(_,i)=>`<td>${E(r[i]??'')||'&nbsp;'}</td>`).join('')}</tr>`).join('')}</tbody></table>`}case'ans':return `<p>${E(b.x||'')}</p><div class="ans" style="min-height:${24*(+b.n||3)}px"></div>`}return ''}).join('')}
async function genOne(key,c,ctx,sig){let best=null,iss=[];for(let t=0;t<3;t++){let r;try{r=await ask(secPrompt(key,c,ctx,iss),{signal:sig,modelTier:'complex'})}catch(e){if(t===2||(e&&(e.name==='AbortError'||e.code==='not_granted'||e.code==='rate_limited')))throw e;continue}
let j;try{j=typeof r==='string'?JSON.parse(r.replace(/```json|```/g,'').trim()):r}catch(e){iss=['JSON tidak valid'];continue}
const bl=normBlocks(j&&(j.blocks||(j.sections&&j.sections[0]&&j.sections[0].blocks)));if(!bl.length){iss=['blocks kosong'];continue}
const v=(V[key]||(()=>[]))(bl,c);if(!v.length)return{bl,warn:''};best={bl,warn:v.join('; ')};iss=v}
if(best)return best;throw new Error('Gagal membuat bagian '+ttl(key))}
const ORD=['cp','tujuan','petunjuk','materi','latihan','soal','hots','literasi','numerasi','refleksi','kunci','kisi','pengetahuan','sikap','keterampilan','penskoran','remedial','pengayaan','soal_ev','kisi_ev','kunci_ev','rubrik_ev','penskoran_ev'];

const plain=h=>new DOMParser().parseFromString(h,'text/html').body.textContent.replace(/\s+/g,' ').trim();
const ctx=S.cur.sections.filter(x=>x!==s&&['cp','tujuan','latihan','soal','hots','literasi','numerasi'].includes(x.key)).map(x=>x.title+': '+plain(x.body)).join('\n\n').slice(0,7000);
toast('Membuat ulang "'+s.title+'"...');let w='';
try{let bl=[];if(s.key==='latihan'){for(let k=1;k<=P;k++){const r=await genOne('latihan',Object.assign({i:k},base),null,null);bl=bl.concat(r.bl);if(r.warn)w+=r.warn+'; '}}else{const r=await genOne(s.key,base,ctx,null);bl=r.bl;w=r.warn}
s.body=blk2html(bl);S.cur.warn=S.cur.warn||{};if(w)S.cur.warn[s.key]=w;else delete S.cur.warn[s.key];snap();persist();render();toast(w?'Bagian dibuat ulang, masih ada catatan di Cek Kelengkapan.':'Bagian berhasil dibuat ulang.',w?'bad':'')}
catch(e){toast(errMsg(e)+' ('+String((e&&e.message)||e).slice(0,100)+')','bad')}}
async function generate(){S.gen=true;render();ctl=new AbortController();const p=S.cur.p,sig=ctl.signal,ev=p.jenis==='evaluasi',P=Math.min(6,Math.max(1,+p.pertemuan||1)),sel=p.komp||[],base={P,n:+p.n||5},res={},warn={};let done=0,total=0,okN=0,lastE=null;
const addW=(k,m)=>{warn[k]=(warn[k]?warn[k]+'; ':'')+m};
const run=async jobs=>{total+=jobs.length;const q=[...jobs];await Promise.all([0,1].map(async()=>{while(q.length){const j=q.shift(),m=$('#gmsg');if(m)m.textContent=`Menyusun ${j.label} (${Math.min(done+1,total)}/${total})...`;try{const r=await genOne(j.key,Object.assign({},base,j.c||{}),j.ctx,sig);res[j.id]=r.bl;okN++;if(r.warn)addW(j.key,r.warn)}catch(e){lastE=e;if(e&&(e.name==='AbortError'||e.code==='not_granted'||e.code==='rate_limited'))throw e;res[j.id]=[{t:'p',x:'[Bagian ini belum berhasil dibuat. Tekan Generate ulang atau isi manual.]'}];addW(j.key,'gagal: '+String((e&&e.message)||e).slice(0,140))}done++}}))};
const J=(k,c,ctx)=>({id:k+(c&&c.i?c.i:''),key:k,c,ctx,label:ttl(k).toLowerCase()+(c&&c.i?' pertemuan '+c.i:'')});
const ctxOf=ks=>Object.keys(res).filter(i=>ks.some(k=>i.startsWith(k))).sort().map(i=>ttl(i.replace(/\d+$/,''))+':\n'+tx(res[i])).join('\n\n').slice(0,7000);
try{if(ev){await run([J('soal_ev')]);const c=ctxOf(['soal_ev']);await run(['kisi_ev','kunci_ev','rubrik_ev'].map(k=>J(k,null,c)));await run([J('penskoran_ev',null,c.slice(0,3500)+'\n\n'+ctxOf(['kunci_ev','rubrik_ev']).slice(0,3500))])}
else{const s1=['cp','tujuan','petunjuk','materi','soal','hots','literasi','numerasi','refleksi'].filter(k=>k==='cp'||k==='tujuan'||sel.includes(k)).map(k=>J(k));if(sel.includes('latihan'))for(let i=1;i<=P;i++)s1.push(J('latihan',{i}));await run(s1);if(!okN)throw (lastE||new Error('Semua permintaan AI gagal'));
const c1=ctxOf(['cp','tujuan','latihan','soal','hots','literasi','numerasi']);await run(['kunci','kisi','pengetahuan','sikap','keterampilan','remedial','pengayaan'].filter(k=>sel.includes(k)).map(k=>J(k,null,c1)));
if(sel.includes('penskoran'))await run([J('penskoran',null,c1.slice(0,3500)+'\n\n'+ctxOf(['pengetahuan','sikap','keterampilan','kunci']).slice(0,3500))])}}
catch(e){S.gen=false;render();const g=$('#gerr');if(g)g.textContent=errMsg(e);toast(errMsg(e),e&&e.name==='AbortError'?'':'bad');return}
const secs=ORD.map(k=>{const ids=Object.keys(res).filter(i=>i===k||(k==='latihan'&&i.startsWith('latihan'))).sort();return ids.length?{key:k,title:ttl(k),body:blk2html(ids.flatMap(i=>res[i]))}:null}).filter(Boolean);
S.gen=false;if(!p.judul)p.judul=(ev?'Evaluasi ':'LKPD ')+p.materi;S.cur.sections=secs;S.cur.warn=warn;S.hist=[];S.hi=-1;snap();persist();S.step=3;render();const nw=Object.keys(warn).length;toast(nw?'Dokumen dibuat. Ada bagian yang perlu diperiksa (lihat Cek Kelengkapan).':(ev?'Evaluasi':'LKPD')+' berhasil dibuat.',nw?'bad':'')}

if(!out){ok=false;break}if(out.judul&&!judul)judul=String(out.judul);secs=secs.concat(out.sections.map(s=>({key:String(s.key||'bagian'),title:String(s.title||'Bagian'),body:clean(s.body||'')})));ctx=secs.filter(s=>['latihan','soal','hots'].includes(s.key)).map(s=>s.title+': '+s.body).join('\n').slice(0,7000)}
S.gen=false;if(secs.length){S.cur.sections=secs;if(judul&&!S.cur.p.judul)S.cur.p.judul=judul;S.hist=[];S.hi=-1;snap();persist();S.step=3;render();toast(ok?'LKPD berhasil dibuat.':'Sebagian bagian gagal dibuat. Pakai tombol Generate ulang di tahap Isi untuk mengulang.',ok?'':'bad')}else{render();const g=$('#gerr');if(g)g.textContent=errMsg(err);toast(errMsg(err),'bad')}}

let out=null,err=null;for(let t=0;t<2&&!out;t++){try{const r=await ask(buildPrompt(),{signal:ctl.signal,modelTier:'complex'});const j=typeof r==='string'?JSON.parse(r.replace(/```json|```/g,'').trim()):r;if(!j||!Array.isArray(j.sections)||!j.sections.length)throw new Error('Format hasil tidak valid');out=j}catch(e){err=e;if(e&&(e.name==='AbortError'||e.code==='not_granted'||e.code==='rate_limited'))break}}

/* ---------- editor ---------- */
function snap(){const s=JSON.stringify(S.cur.sections);if(S.hist[S.hi]===s)return;S.hist=S.hist.slice(0,S.hi+1);S.hist.push(s);if(S.hist.length>60)S.hist.shift();S.hi=S.hist.length-1}
function bindEditor(){const ed=document.querySelectorAll('.ed'),tt=document.querySelectorAll('[data-t]');
ed.forEach(e=>e.addEventListener('input',()=>{S.cur.sections[e.dataset.i].body=clean(e.innerHTML);queueSave()}));
tt.forEach(e=>e.addEventListener('input',()=>{S.cur.sections[e.dataset.t].title=e.textContent;queueSave()}));
const im=$('#img');if(im)im.onchange=()=>{const f=im.files[0];if(!f)return;if(f.size>2e6)return toast('Gambar maksimal 2 MB.','bad');const r=new FileReader();r.onload=()=>{const cap=f.name.replace(/\.\w+$/,'');document.execCommand('insertHTML',false,`<figure><img src="${r.result}" alt="${esc(cap)}" style="max-width:60%"><figcaption>${esc(cap)}</figcaption></figure>`)};r.readAsDataURL(f)}}
function sure(b){if(b.dataset.arm)return true;b.dataset.arm=1;const o=b.textContent;b.textContent='Yakin?';setTimeout(()=>{delete b.dataset.arm;b.textContent=o},3000);return false}
document.addEventListener('mousedown',e=>{if(S.step===3&&e.target.closest('.bar button[data-act]'))e.preventDefault()});
function tblOp(o){const s=getSelection();let n=s.anchorNode;n=n&&(n.nodeType===3?n.parentElement:n);const c=n&&n.closest&&n.closest('td,th');if(!c)return toast('Letakkan kursor di dalam sel tabel dulu.','bad');const ed=c.closest('.ed'),tr=c.parentElement,t=c.closest('table'),ci=c.cellIndex;
if(o==='ar'){const r=tr.cloneNode(true);r.querySelectorAll('td,th').forEach(x=>{x.innerHTML='&nbsp;'});tr.after(r)}
else if(o==='ac'){[...t.rows].forEach(r=>{const x=document.createElement('td');x.innerHTML='&nbsp;';r.cells[ci]&&r.cells[ci].after(x)})}
else if(o==='dr'){tr.remove()}else if(o==='dc'){[...t.rows].forEach(r=>r.cells[ci]&&r.cells[ci].remove())}else if(o==='dt'){t.remove()}
if(t.isConnected&&!t.rows.length)t.remove();if(ed){S.cur.sections[ed.dataset.i].body=clean(ed.innerHTML);snap();queueSave()}}
function secList(m){let n=0,k=0,lamp=false,out=[];const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';S.cur.sections.filter(s=>m==='guru'||!TEACHER.includes(s.key)).forEach(s=>{const t=TEACHER.includes(s.key);if(t&&!lamp){lamp=true;out.push({lamp:1})}out.push({label:t?(++k)+'.':L[n++]+'.',title:s.title,body:s.body})});return out}
function blocks2(html){const d=new DOMParser().parseFromString(html,'text/html'),o=[];const txt=n=>n.textContent.replace(/\s+/g,' ').trim();[...d.body.children].forEach(n=>{const t=n.tagName;if(t==='TABLE'){const rows=[...n.rows].map(r=>[...r.cells].map(txt));{const cp=n.querySelector('caption');if(cp)o.push(['P',txt(cp)]);if(rows.length)o.push(['TBL',rows])}}else if(t==='OL'||t==='UL'){[...n.children].forEach((li,i)=>{const sub=li.querySelector('ol'),own=[...li.childNodes].filter(c=>c!==sub).map(c=>c.textContent).join('').replace(/\s+/g,' ').trim();if(own)o.push(['P',(t==='OL'?(i+1)+'. ':'• ')+own]);if(sub)[...sub.children].forEach((x,j)=>o.push(['P','    '+'ABCDE'[j]+'. '+txt(x)]))})}else if(t==='FIGURE'){o.push(['P','[Gambar] '+txt(n)])}else{const x=txt(n);if(x)o.push(['P',x])}});if(!o.length&&txt(d.body))o.push(['P',txt(d.body)]);return o}
function mkTbl(D,rows){const w=9000;return new D.Table({width:{size:w,type:D.WidthType.DXA},rows:rows.filter(r=>r.length).map((r,i)=>new D.TableRow({children:r.map(c=>new D.TableCell({width:{size:Math.floor(w/r.length),type:D.WidthType.DXA},children:[new D.Paragraph({children:[new D.TextRun({text:c,font:'Times New Roman',size:20,bold:i===0})]})]}))}))})}
function queueSave(){const t=$('#sv');if(t)t.textContent='Menyimpan...';clearTimeout(saveT);clearTimeout(histT);histT=setTimeout(snap,700);saveT=setTimeout(()=>{persist();const t=$('#sv');if(t)t.textContent='Tersimpan';const b=document.querySelector('[data-act=undo]');if(b)b.disabled=S.hi<1},1500)}

async function aiSection(i,m){const s=S.cur.sections[i];toast('Memproses bagian "'+s.title+'"...');try{const r=await ask(`${m} untuk bagian LKPD berikut (jenjang ${S.cur.p.jenjang}, materi ${S.cur.p.materi}). Jangan mengarang fakta. Balas HANYA JSON {"body":"HTML sederhana"}.\n${s.body}`);const j=typeof r==='string'?JSON.parse(r.replace(/```json|```/g,'').trim()):r;s.body=clean(j.body);snap();persist();render();toast('Bagian diperbarui.')}catch(e){toast(errMsg(e),'bad')}}

/* ---------- export ---------- */
function blocksOf(html){const d=new DOMParser().parseFromString(html,'text/html'),o=[];d.body.querySelectorAll('p,li,tr,h1,h2,h3,figcaption').forEach(n=>{const t=(n.tagName==='TR'?[...n.cells].map(c=>c.textContent.trim()).join(' | '):n.textContent.trim());if(t)o.push((n.tagName==='LI'?'• ':'')+t)});if(!o.length&&d.body.textContent.trim())o.push(d.body.textContent.trim());return o}
function docParts(m){const p=S.cur.p,u=S.user,r=[['T',p.sekolah||u.instansi||'Nama Sekolah / Institusi'],['T',(S.cur.p.jenis==='evaluasi'?'INSTRUMEN EVALUASI':'LEMBAR KERJA PESERTA DIDIK (LKPD)')+(m==='guru'?' - VERSI GURU':'')],['T',p.judul||p.materi],['P',`${p.mapel} · ${p.jenjang} ${p.kelas} · ${p.kur} · Semester ${p.semester||'Genap'} · ${p.waktu} · ${p.pertemuan||1} pertemuan${p.guru?' · Penyusun: '+p.guru:''}`],['P','Nama: ____________   Kelompok: ________   Tanggal: ________']];
secList(m).forEach(x=>{if(x.lamp)return r.push(['T','LAMPIRAN']);r.push(['H',x.label+' '+x.title]);blocks2(x.body).forEach(b=>r.push(b))});return r}
async function makeDocx(m){const D=window.docx;const kids=docParts(m).flatMap(([t,x])=>t==='TBL'?[mkTbl(D,x),new D.Paragraph('')]:[new D.Paragraph({heading:t==='H'?D.HeadingLevel.HEADING_2:undefined,alignment:t==='T'?D.AlignmentType.CENTER:undefined,spacing:{after:120},children:[new D.TextRun({text:x,bold:t!=='P',font:'Times New Roman',size:t==='T'?28:24})]})]);
return D.Packer.toBlob(new D.Document({sections:[{properties:{page:{margin:{top:1134,bottom:1134,left:1134,right:1134}}},children:kids}]}))}
function makePdf(m){const {jsPDF}=window.jspdf,d=new jsPDF({unit:'pt',format:'a4'}),W=d.internal.pageSize.getWidth(),H=d.internal.pageSize.getHeight();let y=56;
docParts(m).forEach(([t,x0])=>{let x=x0;if(t==='TBL'){if(d.autoTable){d.autoTable({startY:y,body:x0,theme:'grid',styles:{font:'times',fontSize:9,cellPadding:3,textColor:20},margin:{left:56,right:56},rowPageBreak:'avoid',didParseCell:h=>{if(h.row.index===0)h.cell.styles.fontStyle='bold'}});y=d.lastAutoTable.finalY+12;return}x=x0.map(r=>r.join('  |  ')).join('\n');t='P'}d.setFont('times',t==='P'?'normal':'bold');d.setFontSize(t==='T'?14:t==='H'?12:11);d.splitTextToSize(x,W-112).forEach(l=>{if(y>H-56){d.addPage();y=56}d.text(l,t==='T'?W/2:56,y,{align:t==='T'?'center':'left'});y+=t==='T'?20:16});y+=t==='H'?2:3});return d.output('blob')}
async function download(f){const v=$('#dv').value,dl={save:async o=>{const a=document.createElement('a'),u=URL.createObjectURL(o.data);a.href=u;a.download=o.filename;document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000)}};const e=$('#derr');e.textContent='';if(!dl){e.textContent='Unduhan tidak tersedia di peramban ini.';return}
const ms=v==='both'?['siswa','guru']:[v];for(const m of ms){try{toast('Menyiapkan file...');const b=f==='docx'?await makeDocx(m):makePdf(m);await dl.save({filename:`LKPD-${(S.cur.p.materi||'lkpd').replace(/[^\w]+/g,'-')}-${m}.${f}`,data:b});toast('File siap disimpan.')}catch(x){if(x&&x.code==='declined')toast('Unduhan dibatalkan.');else{e.textContent='Gagal membuat file: '+(x&&x.message||'coba lagi')+'.';toast('Unduhan gagal.','bad')}}}}
